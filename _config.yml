# Site settings
title: Kaizenly
description: "Kaizenly is a simple, privacy-first daily habit tracker for Android. Small habits, big changes."
url: "https://getkaizenly.com"
baseurl: ""

# User settings
username: Kaizenly
user_title: Kaizenly — Daily Habit Tracker
email: luuvanthaoepu@gmail.com
github_username: morejump
profile_picture: https://avatars.githubusercontent.com/morejump

# Build settings
markdown: kramdown
highlighter: rouge
# Posts live under /blog/ so they can never collide with a hand-built page at the
# root, and so the section reads as a section.
permalink: /blog/:title/

plugins:
  - jekyll-sitemap

# html minify
compress_html:
  clippings: all
  comments: all
  endings: []
  profile: false

# Links to include in menu navigation
links:
  section_1:
    - title: home
      url: /
      key_trigger: 1
  section_2:
    - title: github
      url: http://www.github.com/morejump
      new_tab: true
      key_trigger: g

# Leftovers from the space-jekyll-template this site was built on. None of them
# are reachable from the product pages any more, and each one Jekyll builds is
# another thin URL in the sitemap competing with the pages that matter. Delete a
# line here to bring a page back.
exclude:
  - about.html
  - posts.html
  - series.html
  - tags.html
  - search.json
  - feed.xml
  - gulpfile.js
  - package.json
  - yarn.lock
  - screenshot.png
  - README.md
  - LICENSE
  - src
  - node_modules
